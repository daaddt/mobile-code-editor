name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: 1
  CI: 1

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      - name: Configure release signing (debug keystore)
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cd android
          sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/' app/build.gradle || true

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk \
            output/code-editor-${{ github.ref_name }}.apk || \
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
            output/code-editor-${{ github.ref_name }}.apk || \
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            output/code-editor-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-editor-apk
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
